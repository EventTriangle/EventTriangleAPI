<div class="depositInfo">
  <div class="depositInfoContainer">
    <span class="titleSpan">
      <p class="title">Deposit</p>
      <svg-icon src="../../../assets/svg/money.svg" class="titleMoneySvg" />
    </span>
    <p class="overview">An overview of deposit</p>
    <div class="depositForm" [@depositFormAnimation]="">
      <p-select class="depositInput" [options]="creditCardIdArray" [(ngModel)]="creditCardId" placeholder="Credit Card Id" [editable]="true" />
      <input aria-label="Deposit amount" type="text" class="depositInput" [(ngModel)]="amount" placeholder="Amount" inputmode="numeric"/>
      <button type="button" [disabled]="paymentSubmission.isPending('deposit')" class="depositOkButton" (click)="onClickTopUpAccountBalanceHandler()">
        {{paymentSubmission.isPending('deposit') ? 'Processing…' : 'Ok'}}
      </button>
    </div>
  </div>
</div>
<div class="emptyBlock"></div>
