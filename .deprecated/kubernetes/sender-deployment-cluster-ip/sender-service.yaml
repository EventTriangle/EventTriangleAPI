---
kind: Service
apiVersion: v1
metadata:
  name: fluxpay-sender-service
  namespace: fluxpay
spec:
  selector:
    app: fluxpay-sender-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: grpc
      protocol: TCP
      port: 81
      targetPort: 81
  type: ClusterIP
