---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxpay-sender-deployment
  namespace: fluxpay
spec:
  selector:
    matchLabels:
      app: fluxpay-sender-api
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1  # Create at most 1 extra pod during update
      maxUnavailable: 1  # At most 1 pod can be unavailable
  template:
    metadata:
      labels:
        app: fluxpay-sender-api
    spec:
      containers:
        - name: fluxpay-sender-api
          image: kaminome/sender-service:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 80
            - containerPort: 81
          env:
            - name: RabbitMqHost
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: RabbitMqHost

            - name: RabbitMqUsername
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: RabbitMqUsername

            - name: RabbitMqPassword
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: RabbitMqPassword

            - name: DatabaseConnectionString
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: SenderDatabaseConnectionString

            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
