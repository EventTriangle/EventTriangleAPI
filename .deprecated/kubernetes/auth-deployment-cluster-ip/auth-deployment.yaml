---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxpay-auth-deployment
  namespace: fluxpay
spec:
  selector:
    matchLabels:
      app: fluxpay-auth-api
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1  # Create at most 1 extra pod during update
      maxUnavailable: 1  # At most 1 pod can be unavailable
  template:
    metadata:
      labels:
        app: fluxpay-auth-api
    spec:
      containers:
        - name: fluxpay-auth-api
          image: kaminome/auth-service:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 80
            - containerPort: 81
          env:
            - name: FLUXPAY_AD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: FLUXPAY_AD_CLIENT_SECRET

            - name: DatabaseConnectionString
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: AuthDatabaseConnectionString

            - name: RedisUrl
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: RedisUrl

            - name: RedisPassword
              valueFrom:
                secretKeyRef:
                  name: connection-creds
                  key: RedisPassword

            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
