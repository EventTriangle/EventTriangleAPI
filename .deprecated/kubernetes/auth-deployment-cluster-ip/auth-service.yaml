---
kind: Service
apiVersion: v1
metadata:
  name: fluxpay-auth-service
  namespace: fluxpay
spec:
  selector:
    app: fluxpay-auth-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080 # ASP NET CORE 8 default port
    - name: grpc
      protocol: TCP
      port: 81
      targetPort: 81
  type: ClusterIP
