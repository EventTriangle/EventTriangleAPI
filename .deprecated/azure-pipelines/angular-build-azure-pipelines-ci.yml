trigger:
  batch: true
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - build
      - src/authorization/FluxPay.Client

pr:
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - build
      - src/authorization/FluxPay.Client
  
stages:
  - stage: 'Build_Angular'
    displayName: "Build Angular"
    jobs: 
      - job: 'Build_Angular'
        displayName: 'Build Angular'
        strategy: 
          windows:
            imageName: 'windows-latest'
          linux:
            imageName: 'ubuntu-latest'
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            fetchDepth: 0
          
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
              
          - task: Npm@1
            inputs: 
              command: 'ci'
              workingDir: './src/authorization/FluxPay.Client'
              
          - script: |
              npm run build
            displayName: "Build Angular Project"
            workingDirectory: './src/authorization/FluxPay.Client'