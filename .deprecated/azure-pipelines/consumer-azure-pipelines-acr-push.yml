trigger:
  batch: true
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - build
      - src/authorization/FluxPayAPI.Authorization.BusinessLogic
      - src/authorization/FluxPayAPI.Authorization.Presentation
      - src/shared/FluxPayAPI.Shared.Application
      - src/shared/FluxPayAPI.Shared.DTO

pr:
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - build
      - src/authorization/FluxPayAPI.Authorization.BusinessLogic
      - src/authorization/FluxPayAPI.Authorization.Presentation
      - src/shared/FluxPayAPI.Shared.Application
      - src/shared/FluxPayAPI.Shared.DTO

variables:
  - name: appName
    value: 'ConsumerAPI'
  - name: System.Debug
    value: 'false'
  - group: AKS_Settings
  - group: Prefix_Library

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: 'Build_${{ variables.appName }}'
    displayName: 'Build_${{ variables.appName }}'
    jobs:
      - template: templates/docker-build-push-acr-jobs.yml
        parameters:
          JobName: 'Build_${{ variables.appName }}'
          solution: '$(System.DefaultWorkingDirectory)/FluxPayAPI.sln'
          buildConfiguration: 'Release'
          backendProjectPath: '$(System.DefaultWorkingDirectory)/src/consumer/FluxPayAPI.Consumer.Presentation'
          unitTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/consumer/FluxPayAPI.Consumer.UnitTests/FluxPayAPI.Consumer.UnitTests.csproj'
          shouldRunIntegrationTests: 'true'
          shouldRunUnitTests: 'true'
          integrationTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/consumer/FluxPayAPI.Consumer.IntegrationTests/FluxPayAPI.Consumer.IntegrationTests.csproj'
          dockerRegistryUrl: 'azuredevopsacrd01.azurecr.io'
          imageRepository: 'consumer-service'
          dockerfilePath: '$(System.DefaultWorkingDirectory)/src/consumer/Dockerfile'
          dockerServiceConnection: 'Azure_ACR_Connection'
