parameters:
  - name: stageName
    displayName: 'Stage name display name'
    type: string

  - name: vmImage
    displayName: 'Vm Image'
    default: 'ubuntu-latest'
    type: string

  - name: terraformVersion
    displayName: 'Terraform Version'
    type: string
    default: 'latest'

  - name: terraformBasePath
    displayName: 'Terraform base path checked by fmt'
    type: string
    default: '$(System.DefaultWorkingDirectory)/terraform/infrastructure'

  - name: workingDirectory
    displayName: 'Working Directory for Terraform'
    type: string

  - name: storageAccount
    displayName: 'Storage Account'
    type: string

  - name: storageContainer
    displayName: 'Storage Container'
    type: string

  - name: stateFile
    displayName: 'State File'
    type: string

  - name: sasToken
    displayName: 'Sas Token'
    type: string

  - name: subscriptionId
    displayName: 'Azure Subscription Id'
    type: string
    default: ''

  - name: clientId
    displayName: 'Azure Client Id'
    type: string
    default: ''

  - name: clientSecret
    displayName: 'Azure Client Secret'
    type: string
    default: ''

  - name: tenantId
    displayName: 'Azure Tenant Id'
    type: string
    default: ''

  - name: destroy
    displayName: 'Should destroy infrastructure'
    type: boolean

  - name: terraformEnvironment
    displayName: 'Additional Terraform environment variables'
    type: object
    default: {}

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageName }}
    jobs:
      - job: ${{ parameters.stageName }}
        displayName: ${{ parameters.stageName }}
        pool:
          vmImage: ${{ parameters.VmImage }}
        steps:
          - checkout: self
            fetchDepth: 0

          - task: TerraformInstaller@1
            displayName: 'Install Terraform ${{ parameters.terraformVersion }}'
            inputs:
              terraformVersion: '${{ parameters.terraformVersion }}'

          - bash: |
              terraform init -backend=false
              terraform validate
              terraform fmt -check -recursive "${{ parameters.terraformBasePath }}"
            displayName: "Run tf validate"
            workingDirectory: '${{ parameters.workingDirectory }}'

          - bash: |
              terraform init \
                -backend-config="storage_account_name=${TF_STATE_BLOB_ACCOUNT_NAME}" \
                -backend-config="container_name=${TF_STATE_BLOB_CONTAINER_NAME}" \
                -backend-config="key=${TF_STATE_BLOB_FILE}" \
                -backend-config="sas_token=${TF_STATE_BLOB_SAS_TOKEN}" \
                -reconfigure
            displayName: 'Terraform Init'
            workingDirectory: ${{ parameters.workingDirectory }}
            env:
              TF_STATE_BLOB_ACCOUNT_NAME: ${{ parameters.storageAccount }}
              TF_STATE_BLOB_CONTAINER_NAME: ${{ parameters.storageContainer }}
              TF_STATE_BLOB_FILE: ${{ parameters.stateFile }}
              TF_STATE_BLOB_SAS_TOKEN: ${{ parameters.sasToken }}

          - ${{ if eq(parameters.destroy, false) }}:
            - bash: |
                terraform plan -out main.tfplan
              displayName: 'Terraform Plan'
              workingDirectory: ${{ parameters.workingDirectory }}
              env:
                ARM_SUBSCRIPTION_ID: ${{ parameters.subscriptionId }}
                ARM_CLIENT_ID: ${{ parameters.clientId }}
                ARM_CLIENT_SECRET: ${{ parameters.clientSecret }}
                ARM_TENANT_ID: ${{ parameters.tenantId }}
                ${{ each variable in parameters.terraformEnvironment }}:
                  ${{ variable.key }}: ${{ variable.value }}

          - ${{ if eq(parameters.destroy, true) }}:
            - bash: |
                terraform plan -destroy -out main.tfplan
              displayName: 'Terraform Plan'
              workingDirectory: ${{ parameters.workingDirectory }}
              env:
                ARM_SUBSCRIPTION_ID: ${{ parameters.subscriptionId }}
                ARM_CLIENT_ID: ${{ parameters.clientId }}
                ARM_CLIENT_SECRET: ${{ parameters.clientSecret }}
                ARM_TENANT_ID: ${{ parameters.tenantId }}
                ${{ each variable in parameters.terraformEnvironment }}:
                  ${{ variable.key }}: ${{ variable.value }}

          - bash: |
              cp main.tfplan "${BUILD_ARTIFACTSTAGINGDIRECTORY}/"
            displayName: 'Copy Plan'
            workingDirectory: ${{ parameters.workingDirectory }}

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
