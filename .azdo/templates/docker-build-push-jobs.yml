parameters:
  - name: jobName
    displayName: 'Job Name'
    type: string

  - name: solution
    displayName: 'Solution file path'
    type: string

  - name: buildConfiguration
    displayName: 'Build Configuration'
    default: 'Release'
    type: string

  - name: unitTestsProjectPath
    displayName: 'Unit tests project path'
    default: ''
    type: string

  - name: shouldRunUnitTests
    displayName: 'Flag should run unit tests'
    default: true
    type: boolean

  - name: shouldRunIntegrationTests
    displayName: 'Flag should run integration tests'
    type: boolean
    default: true

  - name: integrationTestsProjectPath
    displayName: 'Integration tests project path'
    type: string
    default: ''

  - name: gitVersionVersion
    displayName: 'GitVersion version'
    default: '6.x'
    type: string

  - name: sonarCloudEnabled
    type: boolean
    default: false

  - name: sonarCloudServiceConnection
    type: string
    default: SonarCloud_Service_Connection

  - name: dockerServiceConnection
    displayName: 'Publishing service connection'
    type: string
  - name: scriptFile
    type: string

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobName }}
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false

      - task: gitversion-setup@4.5.0
        displayName: 'GitVersion Setup'
        condition: succeeded()
        inputs:
          versionSpec: ${{ parameters.gitVersionVersion }}

      - task: gitversion-execute@4.5.0
        name: version_step # step id used as a reference for output values
        displayName: Determine Version
        condition: succeeded()

      - bash: |
          set -euo pipefail
          echo "##vso[build.updatebuildnumber]${SEM_VER}-${RUN_ID}"
        displayName: 'Set Build Version'
        condition: succeeded()
        env:
          SEM_VER: $(version_step.SemVer)
          RUN_ID: $(Build.BuildId)

      - bash: |
          echo "Version: $SEM_VER"
          echo "Commit: $COMMIT"
          echo "Branch: $SOURCE_BRANCH"
        displayName: 'Build information'
        condition: succeeded()
        env:
          SEM_VER: $(version_step.SemVer)
          COMMIT: $(Build.SourceVersion)
          SOURCE_BRANCH: $(Build.SourceBranch)

      - task: DotNetCoreCLI@2
        displayName: 'Dotnet restore'
        condition: succeeded()
        inputs:
          command: 'restore'
          projects: '${{ parameters.solution }}'
          arguments: '--verbosity minimal'
          nugetConfigPath: 'nuget.config'

      - ${{ if eq(parameters.sonarCloudEnabled, true) }}:
          - task: SonarCloudPrepare@4
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
            inputs:
              SonarCloud: ${{ parameters.sonarCloudServiceConnection }}
              organization: event-triangle
              scannerMode: dotnet
              projectKey: event-triangle-api
              projectName: eventtriangleapi
              extraProperties: |
                sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/*.trx
                sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/*opencover.xml
                sonar.exclusions=**/Properties/**, **/bin/**, **/obj/**, **/Migrations/**

      - task: DotNetCoreCLI@2
        displayName: 'Build solution'
        condition: succeeded()
        inputs:
          command: 'build'
          projects: '${{ parameters.solution }}'
          arguments: '-c ${{ parameters.buildConfiguration }} -p:Version=$(version_step.semVer) --no-restore'

      - ${{ if eq(parameters.shouldRunUnitTests, true) }}:
          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests'
            inputs:
              command: 'test'
              projects: '${{ parameters.unitTestsProjectPath }}'
              arguments: '--no-build --configuration ${{ parameters.buildConfiguration }} --collect "Code Coverage"'

      - ${{ if eq(parameters.shouldRunIntegrationTests, true) }}:
          - task: DotNetCoreCLI@2
            displayName: 'Run integration tests'
            inputs:
              command: 'test'
              projects: '${{ parameters.integrationTestsProjectPath }}'
              arguments: '--no-build --configuration ${{ parameters.buildConfiguration }} --collect "Code Coverage"'

      - ${{ if eq(parameters.sonarCloudEnabled, true) }}:
          - task: SonarCloudAnalyze@4
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
            inputs: {}

          - task: SonarCloudPublish@4
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
            inputs:
              pollingTimeoutSec: "300"

      - task: Docker@2
        displayName: 'Docker Hub Login'
        inputs:
          command: login
          containerRegistry: ${{ parameters.dockerServiceConnection }}

      # The shared build script publishes with buildx --push using this login.
      - bash: |
          set -euo pipefail
          bash "$SCRIPT_FILE" "${SEM_VER}-${RUN_ID}"
        displayName: 'Docker Build and Push'
        env:
          SCRIPT_FILE: ${{ parameters.scriptFile }}
          SEM_VER: $(version_step.SemVer)
          RUN_ID: $(Build.BuildId)
