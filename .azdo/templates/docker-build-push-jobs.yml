parameters:
  - name: jobName
    type: string
  - name: gitVersionVersion
    type: string
    default: '6.x'
  - name: registryUrl
    displayName: 'Registry host (docker.io for Docker Hub)'
    type: string
    default: 'docker.io'
  - name: imageRepository
    displayName: 'Repository including namespace, e.g. petrokolosov/auth-service'
    type: string
  - name: dockerServiceConnection
    displayName: 'Publishing service connection'
    type: string
  - name: scriptFile
    type: string

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobName }}
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false

      - task: gitversion-setup@4.5.0
        displayName: 'GitVersion Setup'
        inputs:
          versionSpec: ${{ parameters.gitVersionVersion }}

      - task: gitversion-execute@4.5.0
        name: version_step
        displayName: 'Determine Version'

      - bash: |
          set -euo pipefail
          echo "##vso[build.updatebuildnumber]${SEM_VER}-${RUN_ID}"
        displayName: 'Set Build Version'
        env:
          SEM_VER: $(version_step.SemVer)
          RUN_ID: $(Build.BuildId)

      - task: Docker@2
        displayName: 'Docker Hub Login'
        inputs:
          command: login
          containerRegistry: ${{ parameters.dockerServiceConnection }}

      # The shared build script publishes with buildx --push using this login.
      - bash: |
          set -euo pipefail
          bash "$SCRIPT_FILE" "${SEM_VER}-${RUN_ID}"
        displayName: 'Docker Build and Push'
        env:
          SCRIPT_FILE: ${{ parameters.scriptFile }}
          SEM_VER: $(version_step.SemVer)
          RUN_ID: $(Build.BuildId)

      - bash: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -er '.digest | select(startswith("sha256:"))')
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          jq -n --arg image "$IMAGE" --arg tag "$TAG" \
            --arg digest "$DIGEST" --arg commit "$COMMIT" \
            '{image:$image, tag:$tag, digest:$digest, reference:($image+"@"+$digest), commit:$commit}' \
            > "$OUTPUT_FILE"
          echo "Published $IMAGE@$DIGEST"
        displayName: 'Record image version and digest'
        env:
          IMAGE: ${{ parameters.registryUrl }}/${{ parameters.imageRepository }}
          COMMIT: $(Build.SourceVersion)
          TAG: $(version_step.SemVer)-$(Build.BuildId)
          OUTPUT_FILE: $(Build.ArtifactStagingDirectory)/image/published-image.json

      - task: PublishPipelineArtifact@1
        displayName: 'Publish image metadata'
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/image
          artifact: image-${{ parameters.jobName }}

      - task: Docker@2
        displayName: 'Docker Hub Logout'
        condition: always()
        inputs:
          command: logout
          containerRegistry: ${{ parameters.dockerServiceConnection }}
