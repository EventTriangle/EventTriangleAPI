trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - develop
      - main

  paths:
    include:
      # Consumer service (ALL layers)
      - src/consumer/**

      # Shared code used by consumer
      - src/shared/**

      # Pipeline itself (so changes validate)
      - .azdo/**
      - charts/consumer/**
      - charts/validation-values.yaml
      - scripts/gitops/**
      - scripts/docker-build.sh
      - scripts/dockerhub/build-consumer.sh

    exclude:
      # Docs
      - '**/*.md'

      # Docker compose (global/dev only)
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'

      # Ignore other services explicitly
      - src/authorization/**
      - src/sender/**

      # Helm & infra (unless auth-specific)
      - helm/**
      - platform/**
      - cloudflare/**
      - docs/**
      - kubernetes/**
      - img/**
      - terraform/**
      - terraform/azure-devops/**
      - .github/**
      - LICENSE

variables:
  - name: DOCKER_BUILDKIT
    value: '1'
  - name: appName
    value: "Consumer"
  - name: System.Debug
    value: "false"

pool:
  vmImage: "ubuntu-latest"

stages:
  - template: ../templates/docker-build-stage.yml
    parameters:
      stageName: 'PR_Validation_${{ variables.appName }}'
      docker:
        jobName: 'PR_Validation_${{ variables.appName }}'
        solution: '$(System.DefaultWorkingDirectory)/FluxPayAPI.sln'
        buildConfiguration: 'Release'
        unitTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/consumer/FluxPayAPI.Consumer.UnitTests/FluxPayAPI.Consumer.UnitTests.csproj'
        shouldRunUnitTests: true
        shouldRunIntegrationTests: true
        integrationTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/consumer/FluxPayAPI.Consumer.IntegrationTests/FluxPayAPI.Consumer.IntegrationTests.csproj'
        sonarCloudEnabled: false
        scriptFile: "$(System.DefaultWorkingDirectory)/scripts/dockerhub/build-consumer.sh"
        dockerServiceConnection: "Docker_Hub_Connection"
  - template: ../templates/helm-publish-stage.yml
    parameters:
      service: consumer
      dockerStage: 'PR_Validation_${{ variables.appName }}'
  - template: ../templates/gitops-update-stage.yml
    parameters:
      service: consumer
      preview: true
