trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - develop
      - main

  paths:
    include:
      # Sender service (ALL layers)
      - src/sender/**

      # Shared code used by sender
      - src/shared/**

      # Pipeline itself (so changes validate)
      - .azdo/**
      - charts/sender/**
      - scripts/gitops/**
      - scripts/docker-build.sh
      - scripts/dockerhub/build-sender.sh

    exclude:
      # Docs
      - '**/*.md'

      # Docker compose (global/dev only)
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'

      # Ignore other services explicitly
      - src/consumer/**
      - src/authorization/**

      # Helm & infra (unless auth-specific)
      - helm/**
      - platform/**
      - cloudflare/**
      - docs/**
      - kubernetes/**
      - img/**
      - terraform/**
      - terraform/azure-devops/**
      - .github/**
      - LICENSE

variables:
  - name: DOCKER_BUILDKIT
    value: '1'
  - name: appName
    value: "Sender"
  - name: System.Debug
    value: "false"

pool:
  vmImage: "ubuntu-latest"

stages:
  - template: ../templates/docker-build-stage.yml
    parameters:
      stageName: 'PR_Validation_${{ variables.appName }}'
      docker:
        jobName: 'PR_Validation_${{ variables.appName }}'
        buildConfiguration: 'Release'
        unitTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/sender/FluxPayAPI.Sender.UnitTests/FluxPayAPI.Sender.UnitTests.csproj'
        shouldRunIntegrationTests: true
        shouldRunUnitTests: true
        integrationTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/sender/FluxPayAPI.Sender.IntegrationTests/FluxPayAPI.Sender.IntegrationTests.csproj'
        sonarCloudEnabled: false
        scriptFile: "$(System.DefaultWorkingDirectory)/scripts/dockerhub/build-sender.sh"
        dockerServiceConnection: "Docker_Hub_Connection"
  - template: ../templates/helm-publish-stage.yml
    parameters:
      service: sender
      dockerStage: 'PR_Validation_${{ variables.appName }}'
  - template: ../templates/gitops-update-stage.yml
    parameters:
      service: sender
      preview: true
