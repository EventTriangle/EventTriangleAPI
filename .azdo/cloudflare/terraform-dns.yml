trigger: none
pr: none

parameters:
  - name: applyChanges
    displayName: 'Apply the reviewed DNS plan'
    type: boolean
    default: false

variables:
  - group: Cloudflare_API_Key
  - group: Terraform_Azure_Credentials
  - group: Terraform_Backend_StateFile_Settings
  - name: terraformVersion
    value: '1.16.0'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform/cloudflare/environments/dev'
  - name: cloudflareStateFile
    value: 'cloudflare-dev.tfstate'
  - name: aksResourceGroup
    value: 'rg-aks-d01'
  - name: aksClusterName
    value: 'my-aks-cluster-d01'
  - name: traefikNamespace
    value: 'traefik'
  - name: traefikServiceName
    value: 'traefik'
  - name: traefikPublicIp
    value: '10.10.190.1'
  - name: planStageName
    value: 'Cloudflare_Plan'
  - name: applyStageName
    value: 'Cloudflare_Apply'

stages:
  - template: ../templates/terraform-plan-stages.yml
    parameters:
      stageName: ${{ variables.planStageName }}
      vmImage: ubuntu-latest
      terraformVersion: $(terraformVersion)
      terraformScriptType: bash
      terraformFormatDirectory: $(System.DefaultWorkingDirectory)/terraform/cloudflare
      workingDirectory: $(workingDirectory)
      storageAccount: $(library-storage-account)
      storageContainer: $(library-storage-container)
      stateFile: $(cloudflareStateFile)
      sasToken: $(library-sas-token)
      subscriptionId: $(library-subscription-id)
      clientId: $(library-client-id)
      clientSecret: $(library-client-secret)
      tenantId: $(library-tenant-id)
      destroy: false
      planFileName: cloudflare.tfplan
      terraformEnvironment:
        CLOUDFLARE_API_TOKEN: $(cloudflare-api-key)
        TF_VAR_traefik_public_ip: $(traefikPublicIp)
        TF_IN_AUTOMATION: 'true'
      beforeTerraformSteps:
        - bash: |
            bash scripts/azure-cli/az-login.sh
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            az aks get-credentials \
              --resource-group "$AKS_RESOURCE_GROUP" \
              --name "$AKS_CLUSTER_NAME" \
              --overwrite-existing
          displayName: 'Connect to AKS'
          env:
            AZURE_CLIENT_ID: $(library-client-id)
            AZURE_CLIENT_SECRET: $(library-client-secret)
            AZURE_TENANT_ID: $(library-tenant-id)
            AZURE_SUBSCRIPTION_ID: $(library-subscription-id)
            AKS_RESOURCE_GROUP: $(aksResourceGroup)
            AKS_CLUSTER_NAME: $(aksClusterName)

        - bash: |
            terraform/cloudflare/get-traefik-public-ip.sh \
              "$TRAEFIK_NAMESPACE" \
              "$TRAEFIK_SERVICE_NAME" \
              "$TRAEFIK_FALLBACK_IP" \
              "$REQUIRE_LIVE_IP"
          displayName: 'Get Traefik public IP'
          env:
            TRAEFIK_NAMESPACE: $(traefikNamespace)
            TRAEFIK_SERVICE_NAME: $(traefikServiceName)
            TRAEFIK_FALLBACK_IP: $(traefikPublicIp)
            REQUIRE_LIVE_IP: ${{ parameters.applyChanges }}

  - ${{ if eq(parameters.applyChanges, true) }}:
    - template: ../templates/terraform-apply-stages.yml
      parameters:
        stageName: ${{ variables.applyStageName }}
        vmImage: ubuntu-latest
        terraformVersion: $(terraformVersion)
        terraformScriptType: bash
        workingDirectory: $(workingDirectory)
        storageAccount: $(library-storage-account)
        storageContainer: $(library-storage-container)
        stateFile: $(cloudflareStateFile)
        sasToken: $(library-sas-token)
        subscriptionId: $(library-subscription-id)
        clientId: $(library-client-id)
        clientSecret: $(library-client-secret)
        tenantId: $(library-tenant-id)
        environment: dev
        dependsOn: [ '${{ variables.planStageName }}' ]
        condition: ${{ variables.planStageName }}
        planFileName: cloudflare.tfplan
        terraformEnvironment:
          CLOUDFLARE_API_TOKEN: $(cloudflare-api-key)
          TF_IN_AUTOMATION: 'true'
