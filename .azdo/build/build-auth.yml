trigger:
  batch: true
  branches:
    include:
      - main
      - develop
  tags:
    include:
      - v*

pr: none

variables:
  - name: DOCKER_BUILDKIT
    value: '1'
  - name: appName
    value: 'Auth'
  - name: System.Debug
    value: 'false'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - template: ../templates/docker-build-stage.yml
    parameters:
      stageName: 'Build_Test_Push_${{ variables.appName }}'
      docker:
        jobName: 'Build_Test_Push_${{ variables.appName }}'
        solution: '$(System.DefaultWorkingDirectory)/FluxPayAPI.sln'
        buildConfiguration: 'Release'
        # Auth currently has no unit test cases.
        shouldRunUnitTests: false
        shouldRunIntegrationTests: true
        integrationTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/authorization/FluxPayAPI.Authorization.IntegrationTests/FluxPayAPI.Authorization.IntegrationTests.csproj'
        sonarCloudEnabled: true
        sonarCoverageProjects: |
          src/consumer/FluxPayAPI.Consumer.UnitTests/FluxPayAPI.Consumer.UnitTests.csproj
          src/sender/FluxPayAPI.Sender.UnitTests/FluxPayAPI.Sender.UnitTests.csproj
        sonarCloudServiceConnection: 'SonarCloud_Service_Connection'
        dockerServiceConnection: 'Docker_Hub_Connection'
        scriptFile: '$(System.DefaultWorkingDirectory)/scripts/dockerhub/build-auth.sh'
  - template: ../templates/helm-publish-stage.yml
    parameters:
      service: authorization
      dockerStage: 'Build_Test_Push_${{ variables.appName }}'
  - template: ../templates/gitops-update-stage.yml
    parameters:
      service: authorization
