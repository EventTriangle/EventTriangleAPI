trigger:
  batch: true
  branches:
    include:
      - main
      - develop
  tags:
    include:
      - v*

pr: none

variables:
  - name: DOCKER_BUILDKIT
    value: '1'
  - name: appName
    value: 'Sender'
  - name: System.Debug
    value: 'false'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - template: ../templates/docker-build-stage.yml
    parameters:
      stageName: 'Build_Test_Push_${{ variables.appName }}'
      docker:
        jobName: 'Build_Test_Push_${{ variables.appName }}'
        buildConfiguration: 'Release'
        unitTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/sender/FluxPayAPI.Sender.UnitTests/FluxPayAPI.Sender.UnitTests.csproj'
        shouldRunIntegrationTests: true
        shouldRunUnitTests: true
        integrationTestsProjectPath: '$(System.DefaultWorkingDirectory)/src/sender/FluxPayAPI.Sender.IntegrationTests/FluxPayAPI.Sender.IntegrationTests.csproj'
        sonarCloudEnabled: false
        dockerServiceConnection: 'Docker_Hub_Connection'
        scriptFile: '$(System.DefaultWorkingDirectory)/scripts/dockerhub/build-sender.sh'
  - template: ../templates/helm-publish-stage.yml
    parameters:
      service: sender
      dockerStage: 'Build_Test_Push_${{ variables.appName }}'
  - template: ../templates/gitops-update-stage.yml
    parameters:
      service: sender
