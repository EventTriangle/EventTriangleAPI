services:
  auth-service:
    build:
      context: src/authorization
      additional_contexts:
        shared: src/shared
      args:
        VERSION: '1.0.0.0'
        FRONT_API_URL: 'http://localhost:7000/'
      dockerfile: Dockerfile
    ports:
      - "7000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      EVENT_TRIANGLE_AD_CLIENT_SECRET: ${EVENT_TRIANGLE_AD_CLIENT_SECRET}
      RedisUrl: redis
      RedisPassword: ${REDIS_PASSWORD:-redis}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  consumer-service:
    build:
      context: src/consumer
      additional_contexts:
        shared: src/shared
      args:
        VERSION: '1.0.0.0'
      dockerfile: Dockerfile
    ports:
      - "7001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sender-service:
    build:
      context: src/sender
      additional_contexts:
        shared: src/shared
      args:
        VERSION: '1.0.0.0'
      dockerfile: Dockerfile
    ports:
      - "7002:8080"
      - "7005:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  
  rabbit:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-redis} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
