trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - develop
      - main

  paths:
    include:
      # Auth service (ALL layers)
      - src/authorization/**

      # Shared code used by auth
      - src/shared/**

      # Pipeline itself (so changes validate)
      - azure-pipelines/**
      - azure-pipelines/templates/**

    exclude:
      # Docs
      - '**/*.md'

      # Docker compose (global/dev only)
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'

      # Ignore other services explicitly
      - src/consumer/**
      - src/sender/**

      # Helm & infra (unless auth-specific)
      - helm/**
      - platform/**
      - cloudflare/**
      - docs/**
      - kubernetes/**
      - img/**
      - terraform/**
      - terraform-azdo-libraries/**
      - .github/**
      - LICENSE

variables:
  - name: appName
    value: "Auth"
  - name: System.Debug
    value: "false"
  - name: DOCKER_BUILDKIT
    value: "1"

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: "PR_Validation_${{ variables.appName }}"
    displayName: "PR_Validation_${{ variables.appName }}"
    jobs:
      - template: "../templates/docker-build-push-jobs.yml"
        parameters:
          jobName: "Docker_Build_${{ variables.appName }}"
          imageRepository: "auth-service"
          dockerfilePath: "$(System.DefaultWorkingDirectory)/src/authorization/Dockerfile"
          registryUrl: "acrsharedd01.azurecr.io"
          dockerServiceConnection: "Azure_ACR_Connection"
          scriptFile: "$(System.DefaultWorkingDirectory)/scripts/build-auth.sh"
