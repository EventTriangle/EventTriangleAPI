name: Build And Test Sender API
on:
  push:
    branches:
      - develop
      - main
    paths:
      - src/sender/FluxPayAPI.Sender.Application/**
      - src/sender/FluxPayAPI.Sender.BusinessLogic/**
      - src/sender/FluxPayAPI.Sender.Domain/**
      - src/sender/FluxPayAPI.Sender.IntegrationTests/**
      - src/sender/FluxPayAPI.Sender.Presentation/**
      - src/sender/FluxPayAPI.Sender.UnitTests/**
      - .github/**

  pull_request:
    branches:
      - develop
      - main
    paths:
      - src/sender/FluxPayAPI.Sender.Application/**
      - src/sender/FluxPayAPI.Sender.BusinessLogic/**
      - src/sender/FluxPayAPI.Sender.Domain/**
      - src/sender/FluxPayAPI.Sender.IntegrationTests/**
      - src/sender/FluxPayAPI.Sender.Presentation/**
      - src/sender/FluxPayAPI.Sender.UnitTests/**
      - src/shared/FluxPayAPI.Shared.DTO/**
      - src/shared/FluxPayAPI.Shared.Application/**
      - .github/**

  workflow_dispatch:

jobs:
  build-and-test-dotnet:
    name: Sender Build
    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.github/nuget-packages

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sender Build
        uses: ./.github/actions/build-and-test
        with:
          backendCsprojPath: "src/sender/FluxPayAPI.Sender.Presentation/FluxPayAPI.Sender.Presentation.csproj"
          unitTestsProjectPath: "src/sender/FluxPayAPI.Sender.UnitTests"
          integrationTestsProjectPath: "src/sender/FluxPayAPI.Sender.IntegrationTests"
          buildConfiguration: "Release"
          serviceName: "sender-api"
          creatingDatabase: "true"
