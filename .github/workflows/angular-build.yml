name: Angular Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  CI: false

jobs:
  angular-build:
    name: Angular Build
    runs-on: ${{ matrix.environment }}
    strategy:
      matrix:
        environment:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Setup Node.js 24.16.0'
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: 'src/authorization/FluxPay.Client/package-lock.json'

      - name: Install npm 11.16.0
        run: npm install --global --ignore-scripts npm@11.16.0

      - name: 'Print current node version'
        run: node -v

      - name: "Print current npm version"
        run: npm -v

      - name: "Npm ci"
        working-directory: './src/authorization/FluxPay.Client'
        run: npm ci --ignore-scripts

      - name: 'Compile TS files'
        working-directory: './src/authorization/FluxPay.Client'
        run: npm exec -- tsc --noEmit -p tsconfig.app.json

      - name: 'Npm run build'
        working-directory: './src/authorization/FluxPay.Client'
        run: npm run build

