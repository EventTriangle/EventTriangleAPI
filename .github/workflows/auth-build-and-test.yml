name: Build And Test Auth API
on:
  push:
    branches:
      - develop
      - main
    paths:
      - src/sender/EventTriangleAPI.Authorization.BusinessLogic/**
      - src/sender/EventTriangleAPI.Authorization.Presentation/**
      - src/shared/EventTriangleAPI.Shared.DTO/**
      - src/shared/EventTriangleAPI.Shared.Application/**
      - .github/**

  pull_request:
    branches:
      - develop
      - main
    paths:
      - src/sender/EventTriangleAPI.Authorization.BusinessLogic/**
      - src/sender/EventTriangleAPI.Authorization.Presentation/**
      - src/shared/EventTriangleAPI.Shared.DTO/**
      - src/shared/EventTriangleAPI.Shared.Application/**
      - .github/**

  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

env:
  PREVIEW: ${{ github.event_name == 'release' && github.event.release.prerelease }}

jobs:
  build-and-test-dotnet:
    name: Auth Build
    runs-on: ubuntu-latest
    outputs:
      chart-version: ${{ steps.charts.outputs.version }}

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.github/nuget-packages

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check chart release branch
        if: github.event_name == 'release' && env.PREVIEW != 'true'
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Auth Build
        if: env.PREVIEW != 'true'
        uses: ./.github/actions/build-and-test
        with:
          backendCsprojPath: "src/authorization/EventTriangleAPI.Authorization.Presentation/EventTriangleAPI.Authorization.Presentation.csproj"
          buildConfiguration: "Release"
          serviceName: "auth-api"
          unitTestsProjectPath: "src/authorization/EventTriangleAPI.Authorization.UnitTests"
          creatingDatabase: 'true'

      - name: Package Helm charts
        id: charts
        if: github.event_name == 'release'
        env:
          PREVIEW_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          mkdir -p "$RUNNER_TEMP/charts"
          version=$GitVersion_SemVer
          if [[ "$PREVIEW" == true ]]; then
            version=0.0.0
            branch=$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-//; s/-$//')
            suffix="${branch:-branch}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            cp -R charts "$RUNNER_TEMP/preview-charts"
          fi
          for chart in authorization sender consumer; do
            chart_dir="charts/$chart"
            if [[ "$PREVIEW" == true ]]; then
              chart_dir="$RUNNER_TEMP/preview-charts/$chart"
              sed -i "s/^name: .*/name: $chart-$suffix/" "$chart_dir/Chart.yaml"
            fi
            helm lint "$chart_dir"
            helm package "$chart_dir" --version "$version" --destination "$RUNNER_TEMP/charts"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload chart archives
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: ${{ runner.temp }}/charts/*.tgz
          if-no-files-found: error

  publish-charts:
    name: Publish Helm charts
    if: github.event_name == 'release'
    needs: build-and-test-dotnet
    runs-on: ubuntu-latest
    concurrency: publish-helm-charts
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helm-charts
          path: ${{ runner.temp }}/charts

      - name: Publish to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test-dotnet.outputs.chart-version }}
        run: |
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          if [[ "$PREVIEW" == true ]]; then
            registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chart-previews"
          else
            for chart in authorization sender consumer; do
              endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/charts%2F$chart/versions"
              if tags=$(gh api "$endpoint" --paginate --jq '.[].metadata.container.tags[]?' 2>&1); then
                if grep -Fxq "$VERSION" <<< "$tags"; then
                  echo "GHCR already contains $chart:$VERSION." >&2
                  exit 1
                fi
              elif [[ "$tags" != *"(HTTP 404)" ]]; then
                printf '%s\n' "$tags" >&2
                exit 1
              fi
            done
          fi

          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Chart version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          for archive in "$RUNNER_TEMP"/charts/*.tgz; do
            helm push "$archive" "$registry" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$PREVIEW" == true ]]; then
              package=${archive##*/}
              chart=${package%-"$VERSION".tgz}
              helm pull "$registry/$chart" --version "$VERSION" --destination "$RUNNER_TEMP"
              helm template preview "$RUNNER_TEMP/$package" >/dev/null
            fi
          done
