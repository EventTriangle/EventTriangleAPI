name: Build And Test Auth API
on:
  push:
    branches:
      - develop
      - main
    paths:
      - src/sender/FluxPayAPI.Authorization.BusinessLogic/**
      - src/sender/FluxPayAPI.Authorization.Presentation/**
      - src/shared/FluxPayAPI.Shared.DTO/**
      - src/shared/FluxPayAPI.Shared.Application/**
      - .github/**

  pull_request:
    branches:
      - develop
      - main
    paths:
      - src/sender/FluxPayAPI.Authorization.BusinessLogic/**
      - src/sender/FluxPayAPI.Authorization.Presentation/**
      - src/shared/FluxPayAPI.Shared.DTO/**
      - src/shared/FluxPayAPI.Shared.Application/**
      - .github/**

  workflow_dispatch:

jobs:
  build-and-test-dotnet:
    name: Auth Build
    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.github/nuget-packages

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auth Build
        uses: ./.github/actions/build-and-test
        with:
          backendCsprojPath: "src/authorization/FluxPayAPI.Authorization.Presentation/FluxPayAPI.Authorization.Presentation.csproj"
          buildConfiguration: "Release"
          serviceName: "auth-api"
          unitTestsProjectPath: "src/authorization/FluxPayAPI.Authorization.UnitTests"
          creatingDatabase: 'true'
