name: Publish Helm charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/publish-helm-charts.yml'
      - '.github/scripts/publish-helm.py'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/publish-helm-charts.yml'
      - '.github/scripts/publish-helm.py'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install kubeconform
        run: GOBIN="$RUNNER_TEMP" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: Lint, render, and validate charts
        shell: bash
        run: |
          for chart in authorization sender consumer; do
            echo "Validating $chart with chart defaults"
            helm lint "charts/$chart"
            helm template "$chart" "charts/$chart" |
              "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.35.1

            echo "Validating $chart with ingress and autoscaling enabled"
            helm lint "charts/$chart" -f charts/validation-values.yaml
            helm template "$chart" "charts/$chart" -f charts/validation-values.yaml |
              "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.35.1
          done

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Package and push charts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish || github.head_ref || github.ref_name }}
          BASE_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: python3 ./.github/scripts/publish-helm.py --sem-ver "$BASE_SEMVER" --release-target "$RELEASE_TARGET"
