name: Publish Helm charts

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Package and push charts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          BASE_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: python3 ./.github/scripts/publish-helm.py --sem-ver "$BASE_SEMVER" --release-target "$RELEASE_TARGET"
