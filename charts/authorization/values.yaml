fullnameOverride: ""
replicaCount: 1

image:
  repository: docker.io/petrokolosov/auth-service
  tag: "1.0.1-125-1719"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

service:
  name: ""
ports:
  http:
    containerPort: 8080
    servicePort: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
affinity: {}
tolerations: []

startupProbe:
  httpGet:
    path: /swagger/v1/swagger.json
    port: http
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /swagger/v1/swagger.json
    port: http
  periodSeconds: 10
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 15

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: traefik
  host: ""
  routes: []

# Public application settings. Put credential references in secretEnv.
env:
  ASPNETCORE_ENVIRONMENT: Kubernetes

# Existing Secret names and keys in the Helm release namespace.
secretEnv:
  DatabaseConnectionString:
    name: connection-creds
    key: AuthDatabaseConnectionString
  EVENT_TRIANGLE_AD_CLIENT_SECRET:
    name: azure-ad-auth
    key: EVENT_TRIANGLE_AD_CLIENT_SECRET
  RedisPassword:
    name: connection-creds
    key: RedisPassword

frontend:
  baseUrl: /
